<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      `viewport-fit=cover` is load-bearing, not boilerplate. Without it iOS
      reports every env(safe-area-inset-*) as 0, and since
      react-native-safe-area-context's web provider measures those exact
      values, the tab bar loses the 34pt it needs to clear the home indicator.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>InTempo</title>

    <!--
      The page's own ground, which is not the same thing as the app's.
      `ScreenContainer` paints ivory inside the React tree; anything outside it
      — the strip behind the status bar, the overscroll region, the browser
      chrome it tints — falls through to the document, and the document's
      default is white. On a warm-ivory app that shows up as a white band above
      the greeting.

      `theme-color` is the same value for Android and for an installed PWA.

      This hex is the one place in the app allowed to repeat a design token, and
      only because an HTML file cannot import one. It mirrors `colors.bg` in
      `src/design/colors.ts`, and `scripts/flatten-vendor-assets.mjs` fails the
      build if the two drift apart — drift here is invisible in code review and
      obvious on a phone.
    -->
    <meta name="theme-color" content="#F7F2E9" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Expo generates this file by default. It is checked in so it can carry the
      boot watchdog below; everything above and inside <body> matches what Expo
      would have emitted, and Expo still injects the hashed <script> and the
      favicon link at export time.
    -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #F7F2E9;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      /*
       * Web touch should respond on the first frame. The manipulation value
       * tells the browser these controls do not need the old double-tap delay
       * or gesture arbitration, while leaving zoom and scrolling alone.
       */
      [role='button'],
      [role='tab'],
      [role='switch'],
      button {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }

      @media (hover: hover) and (pointer: fine) {
        [role='button']:not([aria-disabled='true']),
        [role='tab']:not([aria-disabled='true']),
        [role='switch']:not([aria-disabled='true']),
        button:not(:disabled) {
          cursor: pointer;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script>
      /*
       * Boot watchdog.
       *
       * A React app that dies before it mounts renders nothing at all — the
       * page is white, the tab title is right, and there is no way to tell a
       * missing bundle from a crashed one without opening devtools. That cost
       * a real debugging session on the first Cloudflare deploy.
       *
       * This runs before the bundle, watches for the three ways it can fail,
       * and puts the reason on screen. If the app mounts, none of it fires and
       * nothing is shown.
       *
       * Deliberately plain: no fonts, no design tokens, no framework. It has
       * to work in exactly the conditions where everything else didn't.
       */
      (function () {
        var reported = false;
        // Resources that failed. Collected rather than reported, because one
        // failing image is not a crash — but if the app never mounts, the list
        // is the most useful thing on the page.
        var resourceFailures = [];

        /*
         * What to say when an error event carries nothing at all.
         *
         * It used to say 'unknown error' and stop, which is true and useless.
         * Everything below is knowable without the error object, and each line
         * has been the answer at least once: which resources had already
         * failed, whether the page is being served somewhere the browser
         * treats as insecure (`crypto.randomUUID` and storage are both absent
         * on a non-secure origin), and which build is actually running — a
         * stale index.html pinned to a deleted bundle looks exactly like a
         * crash.
         */
        function describeNothing(event) {
          var lines = ['The error carried no message.'];
          if (resourceFailures.length) {
            lines.push('', 'Resources that failed first:');
            for (var i = 0; i < resourceFailures.length && i < 8; i += 1) {
              lines.push('  ' + resourceFailures[i]);
            }
          }
          var tag = document.querySelector('script[src*="_expo"]');
          lines.push('', 'bundle: ' + (tag ? tag.src : '(none in page)'));
          lines.push('origin: ' + location.origin);
          lines.push('secure context: ' + (window.isSecureContext ? 'yes' : 'NO'));
          lines.push('agent: ' + navigator.userAgent);
          if (event && event.filename) {
            lines.push('at: ' + event.filename + ':' + (event.lineno || '?'));
          }
          return lines.join('\n');
        }

        function report(title, detail) {
          if (reported) return;
          var root = document.getElementById('root');
          if (!root) return;

          /*
           * **Never over a running app.** This is a boot watchdog and the
           * `error` listener is attached for the life of the page, so it fires
           * just as readily ten minutes into a practice session.
           *
           * When it did, it took the app off the screen. The stylesheet gives
           * `#root` `display:flex; height:100%; flex:1`, and the line below
           * replaces *all* inline style with `display:block` — dropping the
           * height and the flex that react-native-web's container
           * (`flex:1 1 0%`) needs. The mounted tree collapsed to zero height
           * and the only thing left visible was this message.
           *
           * That is what a musician sent in on 2026-08-24: a full screen
           * reading "The app crashed while starting." over "unknown error",
           * on one bar of cellular signal, from an app that had started
           * perfectly well and was still running underneath.
           *
           * Children in `#root` mean React has mounted. After that, whatever
           * went wrong, blanking the app is worse than the thing it is
           * reporting — the app has its own error boundary for the rest.
           */
          if (root.childElementCount > 0) return;

          reported = true;
          root.style.cssText =
            'display:block;padding:24px;background:#FBFAF7;color:#14110E;' +
            'font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;' +
            'overflow:auto;-webkit-text-size-adjust:100%';
          var h = document.createElement('p');
          h.style.cssText = 'margin:0 0 12px;font-weight:600';
          h.textContent = title;
          var p = document.createElement('pre');
          p.style.cssText =
            'margin:0;white-space:pre-wrap;word-break:break-word;color:#5C564D';
          p.textContent = detail;
          root.appendChild(h);
          root.appendChild(p);
        }

        /*
         * A <script> that 404s fires an error event that doesn't bubble, so
         * this listens in the capture phase.
         *
         * **A resource error and a thrown error are not the same event.** An
         * <img> or <link> that fails dispatches a plain Event at the element:
         * no `error`, and no `message`, because only an ErrorEvent has one. So
         * both fell through to the literal string `'unknown error'` — and
         * because `report` latches on the first call, a font or an image that
         * failed could take the screen and hide the real crash behind it.
         *
         * That is not hypothetical. It is what a musician sent in on
         * 2026-08-24: a full screen reading "The app crashed while starting."
         * over "unknown error", which named neither what failed nor where, and
         * left nothing to work from at all.
         *
         * So: resource failures name the element and the URL, and they no
         * longer latch — a page that recovers should be allowed to.
         */
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            var tag = target && target.tagName;

            if (tag === 'SCRIPT') {
              report('The app bundle failed to load.', String(target.src));
              return;
            }

            // A resource, not a thrown error: an Event, never an ErrorEvent.
            if (tag && target !== window) {
              var url = target.src || target.href || '(no url)';
              resourceFailures.push(tag + ' ' + url);
              return;
            }

            var error = event.error;
            report(
              'The app crashed while starting.',
              (error && (error.stack || error.message)) ||
                event.message ||
                describeNothing(event),
            );
          },
          true,
        );

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          report(
            'The app crashed while starting.',
            (reason && (reason.stack || reason.message)) || String(reason),
          );
        });

        // Nothing threw, nothing mounted. Usually means the server answered
        // the bundle request with something that isn't JavaScript — an SPA
        // fallback handing back index.html is the classic — so ask it what it
        // actually returned rather than making the reader guess.
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0 || reported) return;

          var tag = document.querySelector('script[src*="_expo"]');
          var src = tag ? tag.src : '(no bundle script in the page)';
          if (resourceFailures.length) {
            // Nothing threw and nothing mounted, but things failed to load.
            // Say which: a font that 404s has cost this project a day before.
            src += '\n\nResources that failed:\n  ' + resourceFailures.join('\n  ');
          }
          if (!tag || !window.fetch) {
            report('The app did not start.', src);
            return;
          }

          fetch(tag.src, { method: 'GET' })
            .then(function (response) {
              report(
                'The app did not start.',
                src +
                  '\n\nHTTP ' +
                  response.status +
                  '\nContent-Type: ' +
                  (response.headers.get('content-type') || '(none)'),
              );
            })
            .catch(function (error) {
              report('The app did not start.', src + '\n\n' + error);
            });
        }, 8000);
      })();
    </script>
  </body>
</html>
