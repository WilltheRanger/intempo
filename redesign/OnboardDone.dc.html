// Which Today the app opens depends on the theme the viewer is in, the same
// way the app itself would pick its light or dark home screen.
function todayHref(logic) {
  var theme = logic && logic.state && logic.state.theme;
  if (theme !== 'light' && theme !== 'dark') {
    try {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') { theme = attr; }
      else {
        var q = new URLSearchParams(window.location.search).get('theme');
        theme = q === 'dark' ? 'dark' : 'light';
      }
    } catch (e) { theme = 'light'; }
  }
  return theme === 'dark' ? 'Today.dc.html' : 'TodayLight.dc.html';
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.__theme = function (e) {
      var d = e && e.data;
      if (d && d.type === '__dc_theme' && (d.theme === 'light' || d.theme === 'dark')) {
        self.setState({ theme: d.theme });
      }
    };
    try { window.addEventListener('message', this.__theme); } catch (e) {}
  }

  componentWillUnmount() {
    try { window.removeEventListener('message', this.__theme); } catch (e) {}
  }

  renderVals() {
    return {
      todayHref: todayHref(this),
      // Leave a one-shot note so Today knows it is being opened from here and
      // can rise in. The link navigates normally either way.
      handOver: function () {
        try { window.sessionStorage.setItem('intempo:from-welcome', '1'); } catch (e) {}
      }
    };
  }
}
