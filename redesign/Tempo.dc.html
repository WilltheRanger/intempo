<style>
body { margin: 0; background: #F7F2E9; font-family: 'Inter',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }
.tap { border: 1px solid #D8D2C6; color: #14110E; background: transparent;
       transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
.tap.on { background: #1A1714; border-color: #1A1714; color: #FBFAF7; }
.tap.pa { animation: tap-a 200ms cubic-bezier(.2,.7,.3,1); }
.tap.pb { animation: tap-b 200ms cubic-bezier(.2,.7,.3,1); }
@keyframes tap-a { from { transform: scale(0.92); } }
@keyframes tap-b { from { transform: scale(0.92); } }
@media (prefers-reduced-motion: reduce) { .tap.pa, .tap.pb { animation: none; } }
.pick { border: 1px solid #D8D2C6; color: #14110E; background: transparent; }
.pick.on { background: #1A1714; border-color: #1A1714; color: #FBFAF7; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; text-align: left; cursor: pointer; }

<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#F7F2E9;color:#14110E;font-family:'Inter',system-ui,sans-serif;"><div style="padding:0 24px;"><div style="height:32px;"></div><a href="RecordReady.dc.html" style="display:inline-flex;align-items:center;gap:6px;height:44px;margin-left:-6px;text-decoration:none;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#5C564D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;flex-shrink:0;"><path d="M14.8 5.2 8 12l6.8 6.8"></path></svg><span style="font-size:14px;color:#5C564D;">Back</span></a><div style="font-size:11px;font-weight:500;line-height:14px;letter-spacing:0.9px;color:#756E63;margin-top:4px;">ELEGY IN D MINOR</div><h1 style="margin:6px 0 0;font-family:'Newsreader',Georgia,serif;font-size:36px;font-weight:400;line-height:42px;letter-spacing:-0.6px;color:#14110E;">Tempo</h1><div style="height:64px;"></div><div style="display:flex;align-items:baseline;justify-content:center;gap:10px;"><div style="font-family:'Newsreader',Georgia,serif;font-size:96px;line-height:96px;letter-spacing:-3px;font-variant-numeric:tabular-nums;color:#14110E;">{{bpm}}</div><div style="font-size:14px;font-weight:500;letter-spacing:0.9px;color:#756E63;">BPM</div></div><div style="height:44px;"></div><div role="slider" aria-label="Tempo, beats per minute" aria-valuemin="40" aria-valuemax="160" aria-valuenow="{{bpm}}" tabindex="0" onPointerDown="{{grab}}" onPointerMove="{{drag}}" onPointerUp="{{drop}}" onPointerCancel="{{drop}}" onKeyDown="{{nudge}}" style="position:relative;height:34px;touch-action:none;cursor:pointer;"><div style="position:absolute;left:0;right:0;top:15px;height:4px;border-radius:999px;background:#E6E2DA;"></div><div style="position:absolute;left:0;top:15px;height:4px;border-radius:999px;background:#9A7B4F;width:{{pct}};"></div><div style="position:absolute;left:{{pct}};top:5px;width:24px;height:24px;margin-left:-12px;border-radius:12px;background:#FFFFFF;border:2px solid #9A7B4F;"></div></div><div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:#756E63;font-variant-numeric:tabular-nums;"><span>40</span><span>160</span></div><div style="height:28px;"></div><div style="display:flex;justify-content:center;"><button type="button" class="{{tapClass}}" onClick="{{tap}}" style="height:48px;padding:0 26px;border-radius:24px;font-size:15px;font-weight:500;display:inline-flex;align-items:center;">{{tapLabel}}</button></div><div style="height:36px;"></div><div style="display:flex;gap:8px;"><sc-for list="{{picks}}" as="p" hint-placeholder-count="3"><button type="button" class="{{p.cls}}" onClick="{{p.pick}}" style="flex:1;height:40px;border-radius:12px;font-size:13px;display:flex;align-items:center;justify-content:center;white-space:nowrap;">{{p.label}}</button></sc-for></div></div><div style="position:absolute;left:0;right:0;bottom:0;padding:16px 24px 30px;background:#F7F2E9;"><a href="RecordReady.dc.html" style="display:flex;width:100%;height:52px;border-radius:26px;background:#1A1714;color:#FBFAF7;font-size:16px;font-weight:500;align-items:center;justify-content:center;text-decoration:none;">Done</a></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentWillUnmount() { clearTimeout(this.__tapTimer); }

  renderVals() {
    var self = this;
    var st = this.state || {};
    var LO = 40, HI = 160, MARKED = 92;
    function clamp(v) { return Math.max(LO, Math.min(HI, Math.round(v))); }

    // Start from whatever was chosen last, so the page and Record agree.
    if (this.__start === undefined) {
      this.__start = 76;
      try {
        var saved = parseInt(window.sessionStorage.getItem('intempo:bpm'), 10);
        if (saved >= LO && saved <= HI) { this.__start = saved; }
      } catch (x) {}
    }
    var bpm = st.bpm == null ? this.__start : st.bpm;
    var taps = st.taps || [];

    function set(next) {
      if (next.bpm != null) {
        try { window.sessionStorage.setItem('intempo:bpm', String(next.bpm)); } catch (x) {}
      }
      self.setState(next);
    }
    function fromPointer(e) {
      var r = e.currentTarget.getBoundingClientRect();
      var f = r.width ? (e.clientX - r.left) / r.width : 0;
      return clamp(LO + Math.max(0, Math.min(1, f)) * (HI - LO));
    }

    var picks = [
      { label: 'Half · ' + Math.round(MARKED / 2), v: Math.round(MARKED / 2) },
      { label: '\u00be · ' + Math.round(MARKED * 0.75), v: Math.round(MARKED * 0.75) },
      { label: 'Marked · ' + MARKED, v: MARKED }
    ].map(function (p) {
      return { label: p.label, cls: p.v === bpm ? 'pick on' : 'pick',
               pick: function () { set({ bpm: p.v, taps: [] }); } };
    });

    return {
      bpm: bpm,
      pct: ((bpm - LO) / (HI - LO) * 100).toFixed(2) + '%',
      picks: picks,
      tapLabel: taps.length === 0 ? 'Tap tempo' : (taps.length === 1 ? 'Keep tapping' : 'Tapping'),
      tapClass: 'tap' + (taps.length ? ' on ' + (st.flip ? 'pa' : 'pb') : ''),
      tap: function () {
        var now = Date.now();
        var t = (self.state && self.state.taps) || [];
        if (t.length && now - t[t.length - 1] > 2000) { t = []; }
        t = t.concat([now]).slice(-6);
        var next = { taps: t, flip: !(self.state && self.state.flip) };
        if (t.length >= 2) {
          var sum = 0;
          for (var i = 1; i < t.length; i++) { sum += t[i] - t[i - 1]; }
          next.bpm = clamp(60000 / (sum / (t.length - 1)));
        }
        clearTimeout(self.__tapTimer);
        self.__tapTimer = setTimeout(function () { self.setState({ taps: [] }); }, 2000);
        set(next);
      },
      grab: function (e) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
        self.__dragging = true;
        set({ bpm: fromPointer(e), taps: [] });
      },
      drag: function (e) { if (self.__dragging) { set({ bpm: fromPointer(e) }); } },
      drop: function (e) {
        self.__dragging = false;
        try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (x) {}
      },
      nudge: function (e) {
        var step = e.shiftKey ? 5 : 1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); set({ bpm: clamp(bpm + step) }); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); set({ bpm: clamp(bpm - step) }); }
      }
    };
  }
}
</script>
