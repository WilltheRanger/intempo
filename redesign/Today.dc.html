// Which Today the app opens depends on the theme the viewer is in, the same
// way the app itself would pick its light or dark home screen.
function todayHref(logic) {
  var theme = logic && logic.state && logic.state.theme;
  if (theme !== 'light' && theme !== 'dark') {
    try {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') { theme = attr; }
      else {
        var q = new URLSearchParams(window.location.search).get('theme');
        theme = q === 'dark' ? 'dark' : 'light';
      }
    } catch (e) { theme = 'light'; }
  }
  return theme === 'dark' ? 'Today.dc.html' : 'TodayLight.dc.html';
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.__theme = function (e) {
      var d = e && e.data;
      if (d && d.type === '__dc_theme' && (d.theme === 'light' || d.theme === 'dark')) {
        self.setState({ theme: d.theme });
      }
    };
    try { window.addEventListener('message', this.__theme); } catch (e) {}
  }

  componentWillUnmount() {
    try { window.removeEventListener('message', this.__theme); } catch (e) {}
  }

  renderVals() {
    var p = this.props;
    var start = p.fadeStart == null ? 30 : Number(p.fadeStart);
    var peak = (p.maxWash == null ? 96 : Number(p.maxWash)) / 100;
    var span = Math.max(1, 100 - start);
    // the shape of the fall, as fractions of the run from start to the bottom
    var curve = [[0, 0], [0.20, 0.354], [0.4286, 0.729], [0.6571, 0.9375], [1, 1]];
    var parts = ['rgba(26,23,20,0) 0%'];
    for (var i = 0; i < curve.length; i++) {
      parts.push('rgba(26,23,20,' + (peak * curve[i][1]).toFixed(3) + ') '
        + (start + span * curve[i][0]).toFixed(1) + '%');
    }

    var ts = (p.topScrim == null ? 80 : Number(p.topScrim)) / 100;
    var d = p.scrimDepth == null ? 34 : Number(p.scrimDepth);
    var scrim = 'linear-gradient(180deg,rgba(26,23,20,' + ts.toFixed(3) + ') 0%,'
      + 'rgba(26,23,20,' + (ts * 0.675).toFixed(3) + ') ' + (d * 0.382).toFixed(1) + '%,'
      + 'rgba(26,23,20,' + (ts * 0.275).toFixed(3) + ') ' + (d * 0.706).toFixed(1) + '%,'
      + 'rgba(26,23,20,0) ' + d + '%)';

    var dimA = (p.evenDim == null ? 30 : Number(p.evenDim)) / 100;

    // The welcome screen leaves a one-shot note behind when it hands over.
    // Read it once, clear it, and never animate again this visit. If there is
    // no note — the tab bar, a reload, the canvas — Today just appears.
    if (this.__entered === undefined) {
      var fromWelcome = false;
      try {
        fromWelcome = window.sessionStorage.getItem('intempo:from-welcome') === '1';
        if (fromWelcome) window.sessionStorage.removeItem('intempo:from-welcome');
      } catch (e) { fromWelcome = false; }
      this.__entered = fromWelcome;
    }

    return {
      todayHref: todayHref(this),
      enter: this.__entered ? 'rise-in' : '',
      fall: 'linear-gradient(180deg,' + parts.join(',') + ')',
      scrim: scrim,
      dim: 'rgba(26,23,20,' + dimA.toFixed(3) + ')'
    };
  }
}
