<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    // The tempo is chosen on its own page; this only shows what was chosen.
    var bpm = 76;
    try {
      var saved = parseInt(window.sessionStorage.getItem('intempo:bpm'), 10);
      if (saved >= 40 && saved <= 160) { bpm = saved; }
    } catch (x) {}

    // Where the take starts. Chosen from the sheet, or by tapping a bar.
    var SYS = [0, 0, 0, 1, 1, 1, 2, 2, 2, 3, 3, 4, 4, 4, 5, 5];                    // which system each bar sits on
    var NBARS = SYS.length;
    var start = st.startBar || 1;
    function goTo(bar) {
      self.setState({ startBar: bar, sheetOpen: false });
      try {
        var el = document.querySelector('.score-scroll');
        if (el) { el.scrollTo({ top: Math.max(0, 18 + SYS[bar - 1] * 72 - 24), behavior: 'smooth' }); }
      } catch (x) {}
    }
    var bars = {}, pick = {};
    for (var n = 1; n <= NBARS; n++) {
      bars['b' + n] = n === start ? 'bar-hl on' : 'bar-hl';
      pick['b' + n] = (function (b) { return function () { goTo(b); }; })(n);
    }
    var opts = [
      { label: 'From the top', bar: 1 },
      { label: 'Where you stopped', bar: 9 },
      { label: 'Where you rushed last time', bar: 13 }
    ].map(function (o) {
      return { label: o.label, sub: 'Bar ' + o.bar, on: o.bar === start,
               pick: function () { goTo(o.bar); } };
    });

    return {
      bpm: bpm,
      startBar: start,
      bars: bars,
      pick: pick,
      options: opts,
      sheetOpen: !!st.sheetOpen,
      openSheet: function () { self.setState({ sheetOpen: true }); },
      closeSheet: function () { self.setState({ sheetOpen: false }); }
    };
  }
}
</script>
