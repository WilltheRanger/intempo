<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var m = (this.state && this.state.mode) || 'signin';
    var cls = m === 'signup' ? 'show-signup' : (m === 'gap' ? 'show-gap' : 'show-signin');

    // Out, then a held beat on the bare photograph, then in.
    function go(next) {
      self.setState({ mode: 'gap' });
      setTimeout(function () { self.setState({ mode: next }); }, 1500);
    }

    return {
      mode: cls,
      toSignUp: function () { go('signup'); },
      toSignIn: function () { go('signin'); }
    };
  }
}
