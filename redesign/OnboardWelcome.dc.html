<style>
body { margin: 0; background: #F7F2E9; font-family: 'Inter',system-ui,sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: #7F6541; text-decoration: none; }
a:hover { color: #14110E; }
html, body { height: 100%; overflow: hidden; }

/* One loop, 4.2s. The photo sits grey and slightly tilted inside a loose frame; it
   straightens; the scan passes down it leaving crisp notation; and once it is fully
   read, the frame snaps tight, the page gives a small bounce and the tempo it found
   pops up beside it. Then it all eases back. At rest: straight, read, tempo shown. */
.frame { animation: lock 4200ms cubic-bezier(.2,.7,.3,1) infinite; }
@keyframes lock {
  0%, 60%  { transform: scale(1.05); opacity: 0.45; }
  65%      { transform: scale(0.97); opacity: 1; }
  70%, 88% { transform: scale(1); opacity: 1; }
  100%     { transform: scale(1.05); opacity: 0.45; }
}
.page { transform-origin: 50% 50%; animation: straighten 4200ms cubic-bezier(.3,.6,.2,1) infinite; }
@keyframes straighten {
  0%, 6%   { transform: rotate(-3.5deg) scale(1); }
  20%, 60% { transform: rotate(0deg) scale(1); }
  65%      { transform: rotate(0deg) scale(1.035); }
  71%, 88% { transform: rotate(0deg) scale(1); }
  100%     { transform: rotate(-3.5deg) scale(1); }
}
.read { animation: reveal 4200ms linear infinite; }
@keyframes reveal { 0%, 18% { height: 0px; opacity: 1; } 60% { height: 290px; opacity: 1; }
                    88% { height: 290px; opacity: 1; } 100% { height: 290px; opacity: 0; } }
.scan { opacity: 0; animation: scan 4200ms linear infinite; }
@keyframes scan { 0%, 18% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; }
                  58% { opacity: 1; } 60% { transform: translateY(288px); opacity: 0; } 100% { transform: translateY(288px); opacity: 0; } }
.found { transform-origin: 20% 50%; animation: found 4200ms cubic-bezier(.2,.8,.3,1.2) infinite; }
@keyframes found {
  0%, 62%  { transform: scale(0.5); opacity: 0; }
  68%      { transform: scale(1.08); opacity: 1; }
  73%, 88% { transform: scale(1); opacity: 1; }
  96%, 100% { transform: scale(0.9); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .frame, .page, .read, .scan, .found { animation: none; } }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; text-align: left; cursor: pointer; }
</style>
