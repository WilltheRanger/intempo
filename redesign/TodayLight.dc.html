<script type="text/x-dc" data-dc-script data-props="{&quot;fadeStart&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:47,&quot;min&quot;:0,&quot;max&quot;:80,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Ivory fall&quot;},&quot;fadeEnd&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:75,&quot;min&quot;:40,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Ivory fall&quot;},&quot;maxWash&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:100,&quot;min&quot;:40,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Ivory fall&quot;},&quot;topScrim&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:31,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;section&quot;:&quot;Top scrim&quot;},&quot;scrimDepth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:195,&quot;min&quot;:60,&quot;max&quot;:400,&quot;step&quot;:5,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Top scrim&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
// Which Today the app opens depends on the theme the viewer is in, the same
// way the app itself would pick its light or dark home screen.
function todayHref(logic) {
  var theme = logic && logic.state && logic.state.theme;
  if (theme !== 'light' && theme !== 'dark') {
    try {
      var attr = document.documentElement.getAttribute('data-theme');
      if (attr === 'light' || attr === 'dark') { theme = attr; }
      else {
        var q = new URLSearchParams(window.location.search).get('theme');
        theme = q === 'dark' ? 'dark' : 'light';
      }
    } catch (e) { theme = 'light'; }
  }
  return theme === 'dark' ? 'Today.dc.html' : 'TodayLight.dc.html';
}

class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    this.__theme = function (e) {
      var d = e && e.data;
      if (d && d.type === '__dc_theme' && (d.theme === 'light' || d.theme === 'dark')) {
        self.setState({ theme: d.theme });
      }
    };
    try { window.addEventListener('message', this.__theme); } catch (e) {}
  }

  componentWillUnmount() {
    try { window.removeEventListener('message', this.__theme); } catch (e) {}
  }

  renderVals() {
    var p = this.props;
    var start = p.fadeStart == null ? 32 : Number(p.fadeStart);
    var end = p.fadeEnd == null ? 92 : Number(p.fadeEnd);
    var peak = (p.maxWash == null ? 96 : Number(p.maxWash)) / 100;
    if (end <= start) { end = start + 1; }
    var span = end - start;
    // the shape of the fall, as fractions of the run between start and end
    var curve = [[0, 0], [0.18, 0.31], [0.38, 0.75], [0.60, 0.865], [0.80, 0.94], [1, 0.984]];
    var parts = ['rgba(247,242,233,0) 0%'];
    for (var i = 0; i < curve.length; i++) {
      parts.push('rgba(247,242,233,' + (peak * curve[i][1]).toFixed(3) + ') '
        + (start + span * curve[i][0]).toFixed(1) + '%');
    }
    parts.push('rgba(247,242,233,' + peak.toFixed(3) + ') 100%');

    var ts = (p.topScrim == null ? 68 : Number(p.topScrim)) / 100;
    var d = p.scrimDepth == null ? 195 : Number(p.scrimDepth);
    var scrim = 'linear-gradient(180deg,rgba(26,23,20,' + ts.toFixed(3) + ') 0px,'
      + 'rgba(26,23,20,' + (ts * 0.853).toFixed(3) + ') ' + Math.round(d * 0.359) + 'px,'
      + 'rgba(26,23,20,' + (ts * 0.5).toFixed(3) + ') ' + Math.round(d * 0.677) + 'px,'
      + 'rgba(26,23,20,0) ' + d + 'px)';

    if (this.__entered === undefined) {
      var fromWelcome = false;
      try {
        fromWelcome = window.sessionStorage.getItem('intempo:from-welcome') === '1';
        if (fromWelcome) window.sessionStorage.removeItem('intempo:from-welcome');
      } catch (e) { fromWelcome = false; }
      this.__entered = fromWelcome;
    }

    return {
      todayHref: todayHref(this),
      enter: this.__entered ? 'rise-in' : '',
      fall: 'linear-gradient(180deg,' + parts.join(',') + ')',
      scrim: scrim,
      scrimDepth: d
    };
  }
}
</script>
