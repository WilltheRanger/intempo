name: Deploy preview to GitHub Pages

# Builds the frontend as a static site so the screens are viewable in a
# browser without running anything locally. This is a UI preview only —
# no Supabase keys and no API are wired in, so it renders `lib/demo.ts`
# seed data and shows a "Preview" badge. Nothing secret is used or needed.

on:
  push:
    branches: [claude/next-steps-3p2zhk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          # Pages serves from https://<user>.github.io/intempo/
          VITE_BASE_PATH: /intempo/

      - name: SPA fallback for deep links
        # Pages has no rewrite rules, so a refresh on /scores would 404.
        # Serving index.html as 404.html lets the router take over instead.
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
