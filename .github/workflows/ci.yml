name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # **The four logs are part of the Definition of Done, and nothing checked
  # them.** On 2026-08-26 a commit landed with its tooling changes and without
  # its `EDIT_LOG` entry: the script writing the entry ran from the wrong
  # directory and failed on a relative path, while the `git commit` in the same
  # shell command succeeded. Nothing noticed.
  #
  # A log entry is a claim about work, so this cannot check that the entry is
  # any good. It checks the one thing a program can — that the change did not
  # go out in silence. The rule itself is a tested function in
  # `tools/check-log-entry.py`, not shell in this file, because a rule that
  # only runs inside a workflow is a rule nothing checks.
  log-entry:
    name: Change is recorded (EDIT_LOG)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a push of several commits is compared with
          # what was there before it rather than with its own last commit —
          # which would check one commit and wave the rest through.
          fetch-depth: 0

      - name: Check for an EDIT_LOG entry
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          # A first push to a branch reports an all-zero "before", and a
          # shallow or grafted history can leave it unreachable. Falling back
          # to the parent checks less than it should, which is the right
          # direction to fail in: this job must never be the thing that blocks
          # a push it cannot reason about.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1)"
          fi
          python3 tools/check-log-entry.py "$base..HEAD"

      # Cheap, and in this job because it needs nothing but Python and the
      # checkout. It does not fail while the placeholders are listed — see the
      # tool's own docstring for why that is deliberate — so what it actually
      # guards is a *new* asset shipped as the starter's, and a listed one
      # that has been drawn and whose line is now a false claim.
      - name: Brand assets are ours
        run: python3 tools/check-brand-assets.py

      # Also here for the same reason: Python and a checkout, nothing else.
      # This is `test_client_reachability.py`'s counterpart for the app —
      # code that is built, documented and never wired up is this project's
      # most-repeated defect, and it compiles and tests clean every time.
      - name: Every export has a caller
        run: python3 tools/check-dead-exports.py

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.7"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pytest
        run: uv run pytest -q

  # The app that actually ships. `mobile/` is the Expo tree, built to web for
  # Cloudflare Pages — and until this job existed nothing in CI touched it:
  # 52 vitest tests, a `tsc --noEmit` and the web build all ran only on
  # somebody's laptop, while the job below built the *legacy* `frontend/` tree
  # that nobody deploys.
  #
  # Pages builds it too, on the same push. That is not a substitute: a failed
  # Pages build leaves the last good version serving, so the site looks fine
  # and the change is simply not there.
  mobile-check:
    name: Mobile (vitest, tsc, web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The last two steps on purpose: a type error should be reported as a
      # type error, not as a bundler failure thirty seconds later.
      - name: Web build
        run: npm run build:web

      # **The App Store target, which nothing here used to build.** Every check
      # above and every screenshot in `EDIT_LOG.md` runs through the *web*
      # bundle, and the two module graphs are not the same one: `.web.ts` files
      # resolve to native siblings, `Platform.OS` branches fold the other way,
      # and a web-only import in shared code is invisible until a phone runs
      # it. Metro resolves the native graph and Hermes compiles it, so a
      # missing native counterpart or a `document.` outside a guard fails here
      # rather than on a device nobody in CI has.
      #
      # Not a substitute for running the app: it proves the bundle builds, not
      # that it behaves. The native recorder and player still have never made
      # a sound — see `mobile/README.md`.
      - name: iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/ios-bundle

  # **Two checks that had found real defects and ran only when someone
  # remembered to run them.** `tools/audit-a11y.mjs` says so about itself: an
  # earlier version "was run once against the legacy `frontend/` tree on
  # 2026-08-20 and did not survive the rebuild into `mobile/`". Leaving the
  # replacement unwired repeats a failure this repository has already had.
  #
  # A separate job from `mobile-check` on purpose: these drive a real browser,
  # so if one ever does go flaky it must not mask a genuine test or type error
  # in the job beside it.
  #
  # CI has no `.env`, so `build:web` here is already a fixtures build — which is
  # exactly what both tools need.
  app-walk:
    name: App walk + accessibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `--no-save`, matching how both tools document being run locally: this
      # is a check harness, not something the app depends on.
      - name: Install Playwright
        run: |
          npm i -D playwright --no-save
          npx playwright install --with-deps chromium

      - name: Web build
        run: npm run build:web

      - name: Serve it
        run: |
          npx serve dist -l 4320 -s &
          # Poll rather than sleep — the point is to start when it is ready.
          for i in $(seq 30); do
            if curl -sf -o /dev/null http://localhost:4320/; then exit 0; fi
            sleep 1
          done
          echo "the built app never came up on :4320" >&2
          exit 1

      - name: Walk the app
        run: node ../tools/walk-app.mjs 4320

      - name: Accessibility audit
        run: node ../tools/audit-a11y.mjs 4320

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
