# One-click deploy for the API.
#
# Render reads this when you point it at the repository: New → Blueprint →
# pick this repo. Nothing here needs editing first; the secrets are marked
# `sync: false`, which means Render prompts for them instead of storing them in
# git. Fly and Railway both read the same Dockerfile if you prefer those — this
# file is a convenience, not a dependency.
#
# The OMR second opinion is OFF here. Turning it on means building Audiveris
# into the image (`WITH_AUDIVERIS=1`), which adds a JDK, a Gradle build and a
# few hundred megabytes, and the free plan will not finish it. Get the API up
# first; see docs/deploy-omr.md to add it afterwards.
services:
  - type: web
    name: intempo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # `free`, not `starter`. `starter` is a paid instance, and a blueprint that
    # names one makes Render demand a card before it will deploy anything at
    # all — which is a poor first impression of a project you are only trying
    # to see working.
    #
    # What free costs instead: the service sleeps after about 15 minutes idle
    # and the next request pays a cold start of roughly a minute, and there is
    # far less memory. Fine for trying the thing out; change this line to
    # `starter` when the first real user would otherwise be the one waiting.
    plan: free
    healthCheckPath: /v1/health
    envVars:
      # Secrets. Render asks for these on first deploy and keeps them out of git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # The browser refuses every response without a matching origin, so the
      # app's own URL has to be listed here. Set it to wherever the mobile web
      # build is served from — the Cloudflare Pages domain.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
