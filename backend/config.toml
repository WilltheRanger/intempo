# InTempo audio-analysis tuning config.
#
# These are the Batch 3 STARTING values from spec §4. They are not
# final — the real numbers come from the six-clip corpus + your ear
# (see the "Batch 3 Tuning Appendix" in intempo-combined.md). Every
# change to a value in this file MUST be logged in TUNING_LOG.md with
# clip-by-clip regression results.
#
# In production these live in remote config (a Supabase row fetched on
# app start) so we can A/B test thresholds without redeploying. This
# file is the checked-in default the backend falls back to.

[onset]
sr = 22050                 # librosa.load sample rate — mono, 22.05 kHz (§4)
delta = 0.07               # onset_detect peak-pick threshold (§4 default)
pre_max = 20               # CAP on the peak-pick window, not the window itself
# NOTHING READS post_max. The window is derived per take by
# `peak_window_frames`, from the smallest note gap the score and the target BPM
# imply, and the one number is passed to librosa as both pre_max and post_max;
# pre_max above is the cap on it. Changing this value has no effect on any
# reading. Kept because a deployment's remote-config row may still send it, and
# because whether an asymmetric window is right is a tuning question with an
# ear, not an edit here. Held by `app/tests/test_tuning_knobs.py`.
post_max = 20
# **Inert on any ordinary page, like `post_max` above.** It is passed to
# librosa as `wait`, but peak-picking already requires each onset to be the
# maximum over ±`peak_window_frames`, derived from the closest gap the score
# writes — 16 frames (372 ms) on a page of eighths at 80 BPM against this
# value's 3. Swept 60 → 100 → 150 → 200 ms on bowed takes at five attack
# times, 2026-09-14: byte-identical readings at every value. It bites only
# where the written gap falls below it, which is a passage faster than any
# this app has been shown. Left alone rather than removed — a deployment's
# remote-config row may still send it, and whether the floor should be a
# constant at all is a question for an ear. See TUNING_LOG.md, 2026-09-14.
wait_ms = 60               # minimum inter-onset gap; suppresses pizzicato string ring (§7)
pre_emphasis_coef = 0.97   # librosa.effects.preemphasis coefficient

[onset.double_bass]
# Low register: slow attack envelopes, broad onset peaks. Lower delta +
# a high-pass before detection catches soft bass attacks (§7.5 problem 1).
delta = 0.05
highpass_hz = 80.0

[tolerance]
# Bands as a % of one beat's duration at the target BPM. Asymmetric:
# humans tolerate dragging better than rushing, so the dragging bands
# sit slightly wider (§4 tuning appendix step 6). Defaults here are the
# symmetric spec starting values; tune per instrument/room.
rushing_inner_pct = 5.0    # |delta| below this = on (green)
rushing_mid_pct = 10.0     # inner..mid = slight (yellow)
rushing_outer_pct = 20.0   # mid..outer = rush (orange); beyond = severe (red)
dragging_inner_pct = 5.0
dragging_mid_pct = 10.0
dragging_outer_pct = 20.0

[tolerance.pulse]
# When a musician breaks their pulse rather than drifting off it. Below these
# the drift accumulates from the start of the take, so steady rushing shows as
# a growing delta (which is the whole product); above them the reference
# re-anchors, so a hesitation is named where it happened instead of blaming
# every bar after it. Starting values — needs real recordings and an ear.
disturbance_deviations = 6.0   # robust deviations of the take's own interval errors
disturbance_floor_beats = 0.1667  # floor under that, as a fraction of one beat

[trend]
window = 8                 # rolling-average window in notes (§4)

[alignment]
warn_quality = 0.7         # below → show "results may be inaccurate" warning (§7)
broken_quality = 0.4       # below → refuse to report, ask for a re-record (§7)
sakoe_chiba_band = 0.2     # DTW Sakoe-Chiba band radius, ±20% of path length (§7.5a)
# NOTHING READS slur_tolerance_pct. It is the threshold for the whole-slur
# duration check in §4, which was never built — `alignment.py` says so on
# `is_slur_boundary`. What exists is `is_slur_interior`, which excludes those
# notes from the trend and the verdict rather than measuring a phrase against a
# tolerance. Changing this value has no effect on any reading.
slur_tolerance_pct = 15.0

[calibration]
# 2-second BPM calibration clip (§4). Values belong in remote config.
min_duration_s = 1.0
max_duration_s = 5.0
min_peak_dbfs = -24.0      # below → "too quiet, move closer"
min_rms_dbfs = -36.0       # below → "too quiet"
min_onsets = 2
max_onsets = 8
ioi_cv_max = 0.30          # inter-onset-interval coefficient-of-variation reject threshold
octave_ambiguity_threshold = 0.20  # IOI spread below this → offer 2×/0.5× tempo
bpm_min = 40
bpm_max = 240
