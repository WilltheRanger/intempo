# InTempo audio-analysis tuning config.
#
# These are the Batch 3 STARTING values from spec §4. They are not
# final — the real numbers come from the six-clip corpus + your ear
# (see the "Batch 3 Tuning Appendix" in intempo-combined.md). Every
# change to a value in this file MUST be logged in TUNING_LOG.md with
# clip-by-clip regression results.
#
# In production these live in remote config (a Supabase row fetched on
# app start) so we can A/B test thresholds without redeploying. This
# file is the checked-in default the backend falls back to.

[onset]
sr = 22050                 # librosa.load sample rate — mono, 22.05 kHz (§4)
delta = 0.07               # onset_detect peak-pick threshold (§4 default)
pre_max = 20               # CAP on the peak-pick window, not the window itself
# NOTHING READS post_max. The window is derived per take by
# `peak_window_frames`, from the smallest note gap the score and the target BPM
# imply, and the one number is passed to librosa as both pre_max and post_max;
# pre_max above is the cap on it. Changing this value has no effect on any
# reading. Kept because a deployment's remote-config row may still send it, and
# because whether an asymmetric window is right is a tuning question with an
# ear, not an edit here. Held by `app/tests/test_tuning_knobs.py`.
post_max = 20
# **Inert on any ordinary page, like `post_max` above.** It is passed to
# librosa as `wait`, but peak-picking already requires each onset to be the
# maximum over ±`peak_window_frames`, derived from the closest gap the score
# writes — 16 frames (372 ms) on a page of eighths at 80 BPM against this
# value's 3. Swept 60 → 100 → 150 → 200 ms on bowed takes at five attack
# times, 2026-09-14: byte-identical readings at every value. It bites only
# where the written gap falls below it, which is a passage faster than any
# this app has been shown. Left alone rather than removed — a deployment's
# remote-config row may still send it, and whether the floor should be a
# constant at all is a question for an ear. See TUNING_LOG.md, 2026-09-14.
wait_ms = 60               # minimum inter-onset gap; suppresses pizzicato string ring (§7)
pre_emphasis_coef = 0.97   # librosa.effects.preemphasis coefficient

[onset.double_bass]
# **The older spelling, kept because a deployment's remote-config row may
# still send it.** `[onset.instrument.double_bass]` below is the same two
# numbers and is what the code reads; this is the fallback when the
# per-instrument table is absent. Changing one and not the other is how the
# two come to disagree, so they are held equal by
# `app/tests/test_tuning_knobs.py`.
delta = 0.05
highpass_hz = 80.0

# Per-instrument onset settings.
#
# **Until now the pipeline had one boolean, `double_bass`, and three of the
# four instruments shared the path tuned for a violin.** A viola's open C is
# 131 Hz and a cello's is 65 Hz — below the 80 Hz high-pass only the bass was
# given — and both were read with a violin's peak-pick threshold. The analysis
# could not tell them apart, because `analysis_runner` collapsed the
# instrument to `instrument == "double_bass"` before calling it.
#
# **Every instrument below is seeded with exactly the value it was getting, so
# no reading changes.** Violin, viola and cello are identical here because
# that is what they are today, not because it is right: the open strings
# (`mobile/src/lib/score/voice.ts`) are
#
#     violin      G3 196 · D4 294 · A4 440 · E5 659
#     viola       C3 131 · G3 196 · D4 294 · A4 440
#     cello       C2  65 · G2  98 · D3 147 · A3 220
#     bass        E1  41 · A1  55 · D2  73 · G2  98
#
# and a threshold that suits the first cannot be assumed to suit the third.
# Splitting them apart is a tuning question with an ear, on recordings this
# repository does not have — see `fixtures/audio/README.md` and
# `TUNING_LOG.md`. What this table buys is that the question can now be
# answered per instrument instead of being invisible.
#
# `highpass_hz = 0.0` means no filter, which is what the three treble
# instruments get today.
#
# **`highpass_hz` changes no onset, at any value a bass could use, and nothing
# can make it.** Measured 2026-09-22: the detector reads *log*-spectral flux, so
# a filter on the waveform is a constant per band that the flux differences
# away — envelope correlation 0.9999 with and without 80 Hz, onsets identical.
# Moving the cutoff into the detector's lowest band did no better (0.9993 in a
# live room): leakage sixty decibels down makes the same log-flux as the note,
# so 50 Hz notes are all still found with the bands starting at 150 Hz. And the
# room boom it was meant to stop is not detected with no filter at all — a
# sound in the bottom two or three of 128 mel bands barely moves their mean.
# It filters the waveform the tuning dashboard draws. See `audio.high_pass`.

[onset.instrument.violin]
delta = 0.07
highpass_hz = 0.0

[onset.instrument.viola]
delta = 0.07
highpass_hz = 0.0

[onset.instrument.cello]
delta = 0.07
highpass_hz = 0.0

[onset.instrument.double_bass]
delta = 0.05
highpass_hz = 80.0

[onset.recovery]
# A second look for notes the first pass was not confident enough to report,
# run only where the score writes a note and the alignment found none. See
# `services/onset_recovery.py` for why this is a second pass rather than a
# more sensitive detector — the latter was tried on 2026-09-19 and broke
# thirteen tests.
#
# How far either side of a predicted time to look, as a fraction of the
# closest gap the score writes. Derived rather than absolute for the reason
# `peak_window_frames` gives: a fixed number of milliseconds is useless on
# slow music and lets one note be recovered onto its neighbour on fast music.
search_share = 0.25
# How loud a candidate must be, against the onset envelope's own peak.
#
# **Deliberately far below anything the detector reports, and the first value
# tried here was wrong for exactly that reason.** 0.08 looked conservative and
# excluded the entire population this exists to find: a quiet note under
# reverb peaks at 0.030 of the envelope maximum, so a floor at 0.08 rejects it
# and nothing is ever recovered. What makes a low floor safe is the window,
# not the floor — a quarter of the closest written gap, around a time the page
# and the take's own pace agree on, with an interior local maximum required.
floor_ratio = 0.015
# How far above the take's own noise floor the recording must sound where a
# note is recovered, in dB. The floor is the take's quietest 5% of frames —
# the room tone before the first note and after the last.
#
# **The guard the envelope floor above cannot be.** A note that was simply not
# played leaves room tone, and the log-spectral flux of room tone wiggles: a
# dropped note on the varied test page was recovered off a wiggle at 4.9% of the
# envelope peak and 1.6x its neighbourhood — more prominent than some genuine
# quiet notes under reverb. By level the two are nowhere near: room tone sits
# at the floor, and a quiet note lost in a live room is still 30+ dB above it.
# Ten is a margin in that gap, not a tuned point. See TUNING_LOG.md, 2026-09-22.
min_level_db = 10.0

[intake]
# What an uploaded file has to be before the pipeline decodes it.
#
# **The byte cap was a duration cap in disguise, and a file picker ends that.**
# The bucket accepts 50 MB. 50 MB of the WAV the app records is about five
# minutes; 50 MB of 64 kbps MP3 is about one hour and forty minutes — the same
# bytes and twenty times the decode. Nothing downstream had an opinion about
# duration because until a musician could pick a file, nothing needed one.
#
# Ten minutes is comfortably past the longest realistic practice take and
# keeps the worst case bounded. Probed from the container header before any
# sample is decoded, so a two-hour upload is refused in milliseconds.
max_duration_s = 600.0

[tolerance]
# Bands as a % of one beat's duration at the target BPM. Asymmetric:
# humans tolerate dragging better than rushing, so the dragging bands
# sit slightly wider (§4 tuning appendix step 6). Defaults here are the
# symmetric spec starting values; tune per instrument/room.
rushing_inner_pct = 5.0    # |delta| below this = on (green)
rushing_mid_pct = 10.0     # inner..mid = slight (yellow)
rushing_outer_pct = 20.0   # mid..outer = rush (orange); beyond = severe (red)
dragging_inner_pct = 5.0
dragging_mid_pct = 10.0
dragging_outer_pct = 20.0
# Settling in and winding down (the owner, 2026-09-25): a stretch this many
# bars long or shorter, at the very start or end of a take, is not named in
# the verdict line — finding the beat after the count-in, and easing off on
# the last notes. Longer than this, or half the take or more, and it is named
# whole. The chart still draws every bar as played.
settling_bars = 2

[tolerance.pulse]
# When a musician breaks their pulse rather than drifting off it. Below these
# the drift accumulates from the start of the take, so steady rushing shows as
# a growing delta (which is the whole product); above them the reference
# re-anchors, so a hesitation is named where it happened instead of blaming
# every bar after it. Starting values — needs real recordings and an ear.
disturbance_deviations = 6.0   # robust deviations of the take's own interval errors
disturbance_floor_beats = 0.1667  # floor under that, as a fraction of one beat

[trend]
window = 8                 # rolling-average window in notes (§4)

[alignment]
warn_quality = 0.7         # below → show "results may be inaccurate" warning (§7)
broken_quality = 0.4       # below → refuse to report, ask for a re-record (§7)
sakoe_chiba_band = 0.2     # DTW Sakoe-Chiba band radius, ±20% of path length (§7.5a)
# NOTHING READS slur_tolerance_pct. It is the threshold for the whole-slur
# duration check in §4, which was never built — `alignment.py` says so on
# `is_slur_boundary`. What exists is `is_slur_interior`, which excludes those
# notes from the trend and the verdict rather than measuring a phrase against a
# tolerance. Changing this value has no effect on any reading.
slur_tolerance_pct = 15.0

[pitch]
# Whether a take is somebody playing this page, asked of its pitch rather than
# its timing. See `services/pitch_evidence.py` for what is measured and
# `analysis.nothing_played` for what is decided; TUNING_LOG.md, 2026-09-23, for
# every number below and the takes it was measured on. **All synthetic** — the
# same caveat as the corpus: these separate a metronome from a violin by a wide
# margin, and nothing here has yet heard a real room.
#
# After an attack, one pitch class must lead in this share of the listening
# window's frames to count as held.
steady = 0.6
# ...and hold at least this share of the window's chroma energy. A flat
# spectrum gives each class a twelfth (0.083); a bowed string gives its own
# class a third or more.
min_share = 0.2
# A page whose middle written pitch is below this MIDI note (45 is A2) is heard
# through a constant-Q transform, which resolves a bass's bottom octave; any
# other through a short STFT, which keeps fast notes apart. See `_N_FFT` in
# `pitch_evidence.py` for the two measurements that forced the split.
low_register_midi = 45
# ...and these instruments always are, whatever the page says. A bass part
# scanned in the wrong clef reads as a treble page; heard through the STFT, a
# real bass take against it held a pitch after 0.00 of attacks.
low_instruments = ["double_bass"]
# A written pitch counts as heard if it is among this many strongest classes.
# Two, because a string's third harmonic is its fifth, and on a low note heard
# through a phone microphone the fifth can outweigh the root.
top = 2
# ...and holds at least this share of the strongest class's energy. Rank alone
# let noise confirm notes: against a pure beep the second-strongest class is
# noise, and a 1.5 kHz beep "held" a G major page's pitches after 0.31 of notes.
min_relative = 0.5
# At or above this share of notes holding their written pitch, some of the
# page was heard, and nothing below applies: it was played, and what went wrong
# is the rest of the pipeline's to say. Every take with nothing played measured
# 0.00–0.19. Takes with an instrument usually measure near 1.00 — but fast
# legato against a correct page fell to 0.12 (the last note still ringing
# where the next is listened for) and a misread page gives 0.00, which is why
# a low share is never enough on its own: every rule below needs more.
not_played_page = 0.25
# ...and only if that many confirmed notes would happen by luck less often
# than `significance`, at a chance rate of `chance` per note. A share over a
# handful of notes is chance: three glass clinks against a bass page matched
# eight notes and held two, 0.25 — a one-in-three chance. A player who stopped
# after two notes, both held, is one in fifty. Chance is set above anything a
# sound with nothing played measured over many notes (0.00–0.07).
chance = 0.15
significance = 0.05
# Below that, not played if fewer than this share of attacks held any pitch:
# every metronome and empty room measured 0.00–0.03.
not_played_tonal = 0.3
# ...or if this share of the pitched attacks are one pitch, on a page with more
# than one: one object struck again and again. A beeping metronome, a bow
# knocking the stand, a stand or a glass ringing — each measured 1.00. Four
# notes of a different piece measured 0.33, and are left to be called the
# wrong piece.
one_pitch = 0.9
# ...or if the attacks are less tonal than this *and* the take fits the page's
# rhythm worse than `alignment.warn_quality`: talking, at 0.23–0.77 tonal and
# quality 0.47 at best. Every instrument take held 0.87 or more — including
# sixteenths against a page a third off everywhere, a misread clef, which must
# not be called silence. A voice steadier than that is not caught here, and is
# refused by the alignment instead. Only over `alignment.broken_quality`, where
# the alignment would otherwise give a verdict: a real double bass on a phone
# holds a pitch after 0.59–0.69 of attacks (2026-09-25), and one the timing
# cannot pair is refused by the alignment, not told it was not played.
played_tonal = 0.8
# **A pairing whose pitches line up is trusted, and its timing reported rather
# than refused.** The first real take this pipeline heard (a double bass,
# 2026-09-24) played every note of its page in order at a steady 97 BPM, and
# was refused as "same notes, different times" twice over: timing alone lost
# its place, and once pitch found it, the trust score still read human rubato
# as a bad pairing. The owner's rule, which this is: judge the chain of notes —
# one note out of tune, or misread by the scan, does not make the take wrong.
#
# An attack confirms the written note it is paired with when their mismatch
# (`pitch_evidence.mismatch`: 0 same note, 0.5 an octave off, 1 another note)
# is at most this.
confirm_mismatch = 0.25
# ...and a pairing is trusted when at least this share of the notes the page
# asks for (every required note, and the optional ones paired) were heard at
# their written pitch. Of the page's notes, not of the notes paired: a chain
# free to leave notes out can pair only the ones that match, and a different
# tune in the same key matched 100% of the notes it paired. Chance, measured
# on same-key random tunes against a page, 20 seeds each: at most 0.62 of a
# 16-note page, 0.47 of 32, 0.42 of 64. The page itself played with rubato:
# median 0.90–0.94, trusted 59 times in 60. The owner's real take: 0.85
# (timing's own pairing of it: 0.33). See TUNING_LOG.md 2026-09-25.
confirmed_share = 0.7
# ...there are at least this many of them,
confirmed_min_notes = 8
# ...on at least this many different written pitches — a page of one or two
# pitches is matched by chance, and cannot say which note is which.
confirmed_min_pitches = 3

[intonation]
# How in tune a take was, in cents, against the musician's own tuning — the
# pitch chart on the verdict and on Insights (the owner, 2026-09-25). See
# `services/intonation.py`. Measured on the owner's two real bass takes
# (phone microphone): the median note sat 14–15 cents from the take's own
# tuning, the takes themselves 25 cents sharp and 25 flat of A = 440.
#
# A bar whose notes sat within this many cents of the player's tuning is in
# tune. 15: the spread of a steady player on these takes, and about the
# smallest difference a listener hears between two held notes.
in_tune_cents = 15.0
# ...within this many, slightly off; beyond it, clearly off.
slight_cents = 30.0
# A note further than this from its written pitch, after the tuning, is not a
# reading of that note: another note, the last one still ringing, or the
# tracker slipping. A fifth of the owner's bass notes read that far off, which
# per-note listening confirms was the previous note ringing into the window.
not_this_note_cents = 100.0
# Fewer measured notes than this and the take says nothing about pitch.
min_notes = 8
# A whole take this far from A = 440 is told so ("Tuned 25 cents sharp").
tuning_worth_saying_cents = 10.0

[mistakes]
# Two mistakes the timing verdict cannot see, named for the player (the owner,
# 2026-09-26): a wrong note, and an entrance miscounted after a rest. See
# `services/player_mistakes.py`. **Synthetic only** — nothing here has heard a
# real wrong note yet.
#
# More than this share of a take's notes heard as other notes is not a take
# full of mistakes but a page read in the wrong clef or key, and none are named.
wrong_note_max_share = 0.25
# A note is named wrong only if, after the take's own tuning, it sits within
# this many semitones of a semitone other than the written one — as close to
# that note as a player's right notes sit to theirs. The owner's bass measured
# 14.7–15.7 cents typical from its tuning (`[intonation]`). Was 0.3, which told
# the owner a B♭ played 72 cents sharp in a fast chromatic run was a B (28
# cents from it): see TUNING_LOG, 2026-09-26.
clear_note_semitones = 0.2
# An entrance after a rest of a bar or more is named when it comes in at least
# this many quarter beats early or late, at the take's own pace around the rest.
# Under one so a whole beat measured at 0.98 is named; over a half so half a
# beat, which is phrasing, is not.
rest_entry_min_beats = 0.75

[calibration]
# 2-second BPM calibration clip (§4). Values belong in remote config.
min_duration_s = 1.0
max_duration_s = 5.0
min_peak_dbfs = -24.0      # below → "too quiet, move closer"
min_rms_dbfs = -36.0       # below → "too quiet"
min_onsets = 2
max_onsets = 8
ioi_cv_max = 0.30          # inter-onset-interval coefficient-of-variation reject threshold
octave_ambiguity_threshold = 0.20  # IOI spread below this → offer 2×/0.5× tempo
bpm_min = 40
bpm_max = 240
